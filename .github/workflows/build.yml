name: Build APK

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false
      SUPABASE_URL:
        required: false
      SUPABASE_ANON_KEY:
        required: false

jobs:
  client-mod:
    name: Zadrinth Client mod (1.8.9)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Build mod
        working-directory: client-mod
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
          ls -la build/libs
          echo "== Diagnóstico: métodos de capa/skin no Minecraft com nomes yarn"
          MCJAR=""
          for j in $(find .gradle ~/.gradle -name "*.jar" 2>/dev/null | grep -v -e sources -e mappings); do
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/client/network/AbstractClientPlayerEntity.class"; then MCJAR="$j"; break; fi
          done
          echo "jar: $MCJAR"
          if [ -n "$MCJAR" ]; then
            javap -c -p -classpath "$MCJAR" net.minecraft.client.network.AbstractClientPlayerEntity | grep -E "^  (public|protected|private)|invoke|getfield|areturn|ireturn" | head -80
            javap -c -p -classpath "$MCJAR" net.minecraft.client.network.PlayerListEntry | grep -E "^  (public|protected|private)|getfield|putfield|areturn" | head -60
            unzip -l "$MCJAR" | grep -o "net/minecraft/client/network/PlayerListEntry[^ ]*class" | while read c; do
              n=$(echo "$c" | sed 's#/#.#g; s#\.class$##')
              echo "--- $n"; javap -c -p -classpath "$MCJAR" "$n" | grep -E "getstatic|putfield|invoke" | head -30
            done
            javap -c -p -classpath "$MCJAR" net.minecraft.client.render.entity.PlayerModelPart | grep -E "^  (public|protected|private)|getfield|ldc" | head -30
          fi
          echo "Alvos dos mixins no .jar final (devem estar em nomes intermediary):"
          mkdir -p /tmp/modjar && unzip -qo build/libs/zadrinth-client-*.jar -d /tmp/modjar
          unzip -l build/libs/zadrinth-client-*.jar | grep -iE "refmap|mixins.json" || true
          for f in /tmp/modjar/io/github/frostmta/zadrinth/client/mixin/*.class; do
            echo "== $(basename "$f")"
            javap -v "$f" | grep -oE "(method_|field_|class_)[0-9]+[^ ]*|L?net/minecraft/[A-Za-z0-9_/$]+;?" | sort -u | head -20
          done

      - name: Upload mod
        uses: actions/upload-artifact@v7
        with:
          name: zadrinth-client-mod
          path: client-mod/build/libs/zadrinth-client-*.jar
          if-no-files-found: error

  build:
    needs: client-mod
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["all", "arm", "arm64", "x86", "x86_64"]
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download Zadrinth Client mod
        uses: actions/download-artifact@v8
        with:
          name: zadrinth-client-mod
          path: client-mod-jar

      - name: Put mod into the APK assets
        run: |
          jar=$(ls client-mod-jar/zadrinth-client-*.jar | grep -v sources | head -1)
          mkdir -p ZalithLauncher/src/main/assets/client
          cp "$jar" ZalithLauncher/src/main/assets/client/zadrinth-client.jar
          ls -la ZalithLauncher/src/main/assets/client

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ hashFiles('PetLib/rust/Cargo.lock') }}
          restore-keys: petlib-rust-${{ runner.os }}-

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version

      - name: Setup Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "Using NDK at $ndk"
          test -f "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Build APK for ${{ matrix.arch }}
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assemble${{ inputs.variant }} -Darch=${{ matrix.arch }}

      - name: Upload Release APK for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release apk (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/apk/release/*.apk

      - name: Upload Release Mapping for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mapping (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/mapping/release/mapping.txt

      - name: Upload Debug APK for ${{ matrix.arch }}
        if: inputs.variant == 'Debug'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: debug apk (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
