name: Referência do Minecraft 1.21.11 (temporário)

on:
  push:
    branches: [client-1.21.11]
    paths: [".github/workflows/mcsrc.yml"]

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Gerar o código (criptografado: só serve para quem tem a chave privada)
        working-directory: client-mod-1.21.11
        run: |
          chmod +x gradlew
          ./gradlew genSources --stacktrace -q
          jar=$(find ~/.gradle .gradle -name "*minecraft*sources.jar" 2>/dev/null | head -1)
          mkdir -p /tmp/s && cd /tmp/s && unzip -q "$jar" \
            'net/minecraft/client/*' 'com/mojang/*' 'net/minecraft/world/entity/*' 'net/minecraft/world/effect/*' \
            'net/minecraft/world/phys/*' 'net/minecraft/world/scores/*' 'net/minecraft/world/item/*' 'net/minecraft/network/chat/*' \
            'net/minecraft/resources/*' 'net/minecraft/util/*' 'net/minecraft/core/*' 'net/minecraft/world/level/*.java' \
            'net/minecraft/network/protocol/game/*' 'net/minecraft/world/damagesource/*' 'net/minecraft/world/InteractionHand.java' || true
          tar -cJf /tmp/src.tar.xz -C /tmp/s .
          ls -la /tmp/src.tar.xz
          cat > /tmp/pub.pem <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAsN/JkDkcdzoXF+V9K4dT
          +kP6uNGn4bkLteYx37DVBfdnHIJUA0hdq54yLbHX2QAawgd8Tb4INpZKaSnzCJL9
          lTQP71IreO8/Jtl+1k4TUtbKomI3NrKGc5VUM2pjVaojUxYBTf4PWM8FIQXPyKxU
          TJT63pK56/R/CSpowVoXDAfS8lQFNnNqRJZAJjt9hpqvKXO7l/iDaj7jufkl+40T
          WygDYfiw/saW+gRVEXog6iihFCSbQLkIZCFl1bKRZlW6a086ARmYuOff3Mct3dCV
          oLzkH2qBzCo5jdPUwIFmz3RwIEmpz7S30jV0b/j5RatW73tCVCswr08Ie9TNqQO5
          wz9boXqc2cefmRkkdg41HvCSz8egUXUiu0Pn0E0E90zmnZgmHamJEjfVeuMIMOsB
          CdzR6in4MEzIvX8YQP5Ee0JN7Ttgv95Fsw/QEnwuBaLKgC7UJmHXA56orhmrBGX1
          wIuo7HE8SpaQzkp/WPwaEcvBDGjbwtDyZ+cep8/6XW7rTc5ltEqYnMruRKfwUB3e
          a4YFzJ41o6bjFgaZ6gZ9wIDAJlENm88me2IfWY2fua+lTdVhMyFvUpsUfhpwZn/l
          9/VPjMgsJoC6L81jYQGv8o2VRC8uZ0/gAo4GVEtQ/skDgkDhqDWQwU7+4ofQ7jRZ
          iXDnDqRWXz2KOjZAvR1bjfsCAwEAAQ==
          -----END PUBLIC KEY-----
          KEY
          sed -i 's/^ *//' /tmp/pub.pem
          openssl rand -hex 32 > /tmp/k
          echo "==KEY=="
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -in /tmp/k | base64 -w 0; echo
          echo "==DATA=="
          openssl enc -aes-256-cbc -pbkdf2 -pass file:/tmp/k -in /tmp/src.tar.xz | base64 -w 1000
          echo "==END=="
