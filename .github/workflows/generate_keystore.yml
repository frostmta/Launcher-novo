name: Gerar chave de assinatura (rodar uma vez)

# Cria a chave que assina os APKs de release do Zadrinth Launcher.
# Antes de rodar, crie o secret STORE_PASSWORD (Settings > Secrets and variables > Actions).
# A chave é salva criptografada em ZalithLauncher/zadrinth_release.jks.
# Guarde a senha em um lugar seguro: sem ela não dá para lançar atualizações
# que instalem por cima da versão anterior.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Gerar zadrinth_release.jks
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          KS=ZalithLauncher/zadrinth_release.jks
          if [ -f "$KS" ]; then
            echo "::error::$KS já existe. A chave não será substituída (isso impediria atualizar o app)."
            exit 1
          fi
          if [ -z "${STORE_PASSWORD}" ]; then
            echo "::error::Crie o secret STORE_PASSWORD antes de rodar este workflow."
            exit 1
          fi
          if [ "${#STORE_PASSWORD}" -lt 16 ]; then
            echo "::error::Use uma senha com pelo menos 16 caracteres no secret STORE_PASSWORD."
            exit 1
          fi
          keytool -genkeypair -noprompt \
            -keystore "$KS" -storetype PKCS12 \
            -storepass "$STORE_PASSWORD" \
            -alias zadrinth -keyalg RSA -keysize 4096 -validity 36500 \
            -dname "CN=Zadrinth Launcher, O=frostmta"
          keytool -list -keystore "$KS" -storetype PKCS12 -storepass "$STORE_PASSWORD" | grep -i zadrinth

      - name: Salvar a chave no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ZalithLauncher/zadrinth_release.jks
          git commit -m "Adicionar chave de assinatura de release do Zadrinth [skip ci]"
          git push
