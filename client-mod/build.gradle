plugins {
	id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
	id "legacy-looming" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings(legacy.yarn(project.minecraft_version, project.yarn_build))
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Sem Legacy Fabric API: o mod só precisa do loader (mais fácil de instalar pelo launcher)
}

processResources {
	// Supabase (sincronização entre jogadores): vem dos segredos do GitHub no CI.
	// Sem eles, o mod funciona normal, só o ícone do TAB aparece apenas para você.
	def supabaseUrl = System.getenv("SUPABASE_URL") ?: ""
	def supabaseKey = System.getenv("SUPABASE_ANON_KEY") ?: ""
	inputs.property "version", project.version
	inputs.property "supabaseUrl", supabaseUrl
	inputs.property "supabaseKey", supabaseKey

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
	filesMatching("zadrinth-client.properties") {
		expand "version": project.version, "supabaseUrl": supabaseUrl, "supabaseKey": supabaseKey
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	if (JavaVersion.current().isJava9Compatible()) {
		it.options.release = 8
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}
